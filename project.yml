name: MCE
options:
  bundleIdPrefix: cn.mce
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"          # 先用宽松并发模式，降低首版编译摩擦
    TARGETED_DEVICE_FAMILY: "1"   # 仅 iPhone

targets:
  MCE:
    type: application
    platform: iOS
    sources: [App, Core, Forum]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.mce.starlight
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: "MCE"

  MCETests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: MCE

schemes:
  MCE:
    build:
      targets:
        MCE: all
        MCETests: [test]
    test:
      targets:
        - MCETests
